<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nested architecture of the Factorio server</title>
  <desc id="desc">Factorio runs in AMP, inside a CubeAMP VM, inside Proxmox, which itself runs on a shared virtual host.</desc>
  <rect width="1600" height="900" fill="#F7F8FA"/>
  <g stroke="#D6D9E0" stroke-width="1" opacity=".65">
    <path d="M80 120H1520M80 240H1520M80 360H1520M80 480H1520M80 600H1520M80 720H1520"/>
    <path d="M200 70V830M440 70V830M680 70V830M920 70V830M1160 70V830M1400 70V830"/>
  </g>
  <text x="90" y="105" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">NESTED RESOURCES</text>
  <text x="90" y="145" font-family="Inter,Arial,sans-serif" font-size="18" fill="#6B7280">An allocation is a request, not guaranteed capacity</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="100" y="220" width="310" height="420" rx="18" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    <text x="135" y="275" font-size="18" fill="#6B7280">LEVEL 1</text>
    <text x="135" y="320" font-size="28" font-weight="700" fill="#111827">Virtual host</text>
    <text x="135" y="370" font-size="24" fill="#7C3AED">8 vCPU</text>
    <text x="135" y="410" font-size="24" fill="#7C3AED">≈ 23 GiB</text>
    <path d="M135 470H375" stroke="#D6D9E0" stroke-width="2"/>
    <text x="135" y="520" font-size="18" fill="#374151">Shared CPU and RAM</text>
    <text x="135" y="552" font-size="18" fill="#374151">with the provider's</text>
    <text x="135" y="584" font-size="18" fill="#374151">infrastructure</text>

    <path d="M430 430H500" stroke="#2563EB" stroke-width="5"/>
    <path d="M490 418L510 430L490 442" fill="none" stroke="#2563EB" stroke-width="5"/>

    <rect x="520" y="180" width="390" height="500" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="555" y="235" font-size="18" fill="#6B7280">LEVEL 2</text>
    <text x="555" y="280" font-size="30" font-weight="700" fill="#111827">Proxmox</text>
    <rect x="555" y="330" width="145" height="110" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="575" y="370" font-size="17" font-weight="700" fill="#4C1D95">Neighboring VM</text>
    <text x="575" y="405" font-size="17" fill="#4C1D95">2 vCPU</text>
    <rect x="720" y="330" width="150" height="110" rx="10" fill="#EEF2FF" stroke="#2563EB" stroke-width="2"/>
    <text x="740" y="370" font-size="17" font-weight="700" fill="#1E3A8A">CubeAMP</text>
    <text x="740" y="405" font-size="17" fill="#1E3A8A">4 vCPU</text>
    <g fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5">
      <rect x="555" y="475" width="92" height="70" rx="8"/>
      <rect x="664" y="475" width="92" height="70" rx="8"/>
      <rect x="773" y="475" width="92" height="70" rx="8"/>
      <rect x="555" y="560" width="92" height="70" rx="8"/>
      <rect x="664" y="560" width="92" height="70" rx="8"/>
      <rect x="773" y="560" width="92" height="70" rx="8"/>
    </g>
    <text x="576" y="518" font-size="15" fill="#374151">LXC</text>
    <text x="685" y="518" font-size="15" fill="#374151">LXC</text>
    <text x="794" y="518" font-size="15" fill="#374151">LXC</text>
    <text x="576" y="603" font-size="15" fill="#374151">LXC</text>
    <text x="685" y="603" font-size="15" fill="#374151">…</text>
    <text x="794" y="603" font-size="15" fill="#374151">LXC</text>

    <path d="M930 430H1000" stroke="#2563EB" stroke-width="5"/>
    <path d="M990 418L1010 430L990 442" fill="none" stroke="#2563EB" stroke-width="5"/>

    <rect x="1020" y="245" width="470" height="370" rx="18" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
    <text x="1055" y="300" font-size="18" fill="#6B7280">LEVELS 3–4</text>
    <rect x="1055" y="340" width="400" height="220" rx="14" fill="#EEF2FF" stroke="#2563EB" stroke-width="3"/>
    <text x="1090" y="390" font-size="25" font-weight="700" fill="#1E3A8A">VM CubeAMP</text>
    <rect x="1090" y="430" width="330" height="85" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1120" y="466" font-size="17" fill="#6B7280">AMP</text>
    <text x="1120" y="496" font-size="24" font-weight="700" fill="#111827">FACTORIO</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="460" y="740" width="680" height="78" rx="39" fill="#111827"/>
    <text x="800" y="790" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2 CPU schedulers · 2 memory management layers</text>
  </g>
</svg>
