<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Swap, невидимый из виртуальной машины</title>
  <desc id="desc">Гостевая система показывает нулевой swap, пока хост вытесняет страницы процесса QEMU в свой swap.</desc>
  <rect width="1600" height="900" fill="#F7F8FA"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="100" font-size="28" font-weight="700" fill="#111827">SWAP, НЕВИДИМЫЙ ИЗ ГОСТЕВОЙ СИСТЕМЫ</text>
    <text x="90" y="140" font-size="18" fill="#6B7280">Два уровня памяти показывают разные картины</text>

    <rect x="100" y="210" width="610" height="500" rx="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="145" y="270" font-size="20" fill="#6B7280">ВНУТРИ CUBEAMP</text>
    <text x="145" y="320" font-size="32" font-weight="700" fill="#111827">Гостевая система видит RAM</text>
    <rect x="145" y="375" width="520" height="110" rx="12" fill="#EEF2FF"/>
    <text x="185" y="425" font-size="24" fill="#1E3A8A">Swap гостя</text>
    <text x="620" y="445" text-anchor="end" font-size="44" font-weight="800" fill="#10B981">0</text>
    <text x="620" y="472" text-anchor="end" font-size="16" fill="#6B7280">устройство не настроено</text>
    <g fill="#2563EB">
      <rect x="150" y="555" width="84" height="92" rx="8" opacity=".92"/>
      <rect x="252" y="525" width="84" height="122" rx="8" opacity=".80"/>
      <rect x="354" y="570" width="84" height="77" rx="8" opacity=".68"/>
      <rect x="456" y="500" width="84" height="147" rx="8" opacity=".56"/>
      <rect x="558" y="545" width="84" height="102" rx="8" opacity=".44"/>
    </g>
    <text x="145" y="680" font-size="16" fill="#6B7280">страницы представлены как физическая память</text>

    <path d="M745 460H855" stroke="#7C3AED" stroke-width="6" stroke-dasharray="14 12"/>
    <path d="M840 445L862 460L840 475" fill="none" stroke="#7C3AED" stroke-width="6"/>
    <text x="800" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#7C3AED">QEMU</text>

    <rect x="890" y="210" width="610" height="500" rx="20" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <text x="935" y="270" font-size="20" fill="#6B7280">НА PROXMOX</text>
    <text x="935" y="320" font-size="28" font-weight="700" fill="#111827">Хост может вытеснить эти страницы</text>
    <rect x="935" y="375" width="520" height="105" rx="12" fill="#F3F4F6"/>
    <text x="975" y="422" font-size="24" fill="#374151">VmRSS</text>
    <text x="1415" y="438" text-anchor="end" font-size="34" font-weight="800" fill="#111827">5 962 900 kB</text>
    <rect x="935" y="505" width="520" height="115" rx="12" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <text x="975" y="552" font-size="24" fill="#9A3412">VmSwap</text>
    <text x="1415" y="573" text-anchor="end" font-size="38" font-weight="800" fill="#EF4444">5 743 220 kB</text>
    <text x="935" y="665" font-size="16" fill="#6B7280">RSS и VmSwap — разные счётчики</text>

    <rect x="390" y="770" width="820" height="70" rx="35" fill="#111827"/>
    <text x="800" y="815" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">После перезапуска: VmSwap QEMU = 0 kB</text>
  </g>
</svg>
