<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Before and after reducing contention</title>
  <desc id="desc">Host metrics before and after several grouped changes, with a warning that individual causality was not established.</desc>
  <rect width="1600" height="900" fill="#F7F8FA"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="100" font-size="28" font-weight="700" fill="#111827">CONTENTION: BEFORE / AFTER</text>
    <text x="90" y="140" font-size="18" fill="#6B7280">Operational snapshots — not a controlled A/B test</text>

    <rect x="90" y="205" width="550" height="520" rx="20" fill="#FFFFFF" stroke="#EF4444" stroke-width="4"/>
    <text x="135" y="270" font-size="22" font-weight="800" fill="#EF4444">BEFORE</text>
    <g font-size="23" fill="#111827">
      <text x="135" y="340">CubeAMP</text><text x="595" y="340" text-anchor="end" font-weight="800">6 vCPUs / 16 GiB</text>
      <text x="135" y="410">Neighboring VM</text><text x="595" y="410" text-anchor="end" font-weight="800">6 vCPU</text>
      <text x="135" y="480">PSI CPU avg10</text><text x="595" y="480" text-anchor="end" font-weight="800">33.35%</text>
      <text x="135" y="550">System CPU time</text><text x="595" y="550" text-anchor="end" font-weight="800">43–64%</text>
      <text x="135" y="620">Idle</text><text x="595" y="620" text-anchor="end" font-weight="800">9–28%</text>
      <text x="135" y="690">CubeAMP VmSwap</text><text x="595" y="690" text-anchor="end" font-weight="800" fill="#EF4444">5 743 220 kB</text>
    </g>

    <rect x="960" y="205" width="550" height="520" rx="20" fill="#FFFFFF" stroke="#10B981" stroke-width="4"/>
    <text x="1005" y="270" font-size="22" font-weight="800" fill="#10B981">AFTER</text>
    <g font-size="23" fill="#111827">
      <text x="1005" y="340">CubeAMP</text><text x="1465" y="340" text-anchor="end" font-weight="800">4 vCPUs / 6 GiB</text>
      <text x="1005" y="410">Neighboring VM</text><text x="1465" y="410" text-anchor="end" font-weight="800">2 vCPUs</text>
      <text x="1005" y="480">PSI CPU avg10</text><text x="1465" y="480" text-anchor="end" font-weight="800">4.43%</text>
      <text x="1005" y="550">System CPU time</text><text x="1465" y="550" text-anchor="end" font-weight="800">2%</text>
      <text x="1005" y="620">Idle</text><text x="1465" y="620" text-anchor="end" font-weight="800">93%</text>
      <text x="1005" y="690">CubeAMP VmSwap</text><text x="1465" y="690" text-anchor="end" font-weight="800" fill="#10B981">0 kB</text>
    </g>

    <path d="M670 445H920" stroke="#2563EB" stroke-width="6"/>
    <path d="M900 428L930 445L900 462" fill="none" stroke="#2563EB" stroke-width="6"/>
    <rect x="665" y="490" width="270" height="135" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="3"/>
    <text x="800" y="535" text-anchor="middle" font-size="18" font-weight="800" fill="#9A3412">GROUPED CHANGES</text>
    <text x="800" y="570" text-anchor="middle" font-size="16" fill="#9A3412">memory · vCPU · priority</text>
    <text x="800" y="598" text-anchor="middle" font-size="16" fill="#9A3412">swappiness · halt polling</text>

    <rect x="280" y="775" width="1040" height="70" rx="35" fill="#111827"/>
    <text x="800" y="818" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Measured improvement ≠ proven individual causality</text>
  </g>
</svg>
